---
# openbar.yml
# Installs the Open Bar GNOME extension and configures the VPN topbar color changer.
# - Installs openbar@neuromorph via gnome-extensions-cli
# - Loads saved dconf settings for Open Bar
# - Deploys vpn-color-listener.sh to ~/.local/bin and runs it as a systemd user service
# - The listener polls /tmp/vpn_active (written by the NM dispatcher) and updates Open Bar colors

- name: Install Open Bar GNOME extension
  ansible.builtin.command:
    cmd: "{{ ansible_facts['env']['HOME'] }}/.local/bin/gext install openbar@neuromorph"
  register: gext_result
  changed_when: "'already installed' not in gext_result.stdout"
  tags:
    - work

- name: Load Open Bar dconf settings
  ansible.builtin.shell:
    cmd: "dconf load /org/gnome/shell/extensions/openbar/ < {{ role_path }}/files/openbar.dconf"
  tags:
    - work

- name: Deploy VPN color listener script
  ansible.builtin.copy:
    src: vpn-color-listener.sh
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/vpn-color-listener.sh"
    mode: "0755"
  tags:
    - work

- name: Ensure systemd user service directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user"
    state: directory
    mode: "0755"
  tags:
    - work

- name: Deploy VPN color listener systemd user service
  ansible.builtin.copy:
    src: vpn-color-listener.service
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/vpn-color-listener.service"
    mode: "0644"
  tags:
    - work

- name: Enable and start VPN color listener service
  ansible.builtin.systemd:
    name: vpn-color-listener.service
    enabled: true
    state: started
    scope: user
    daemon_reload: true
  tags:
    - work
