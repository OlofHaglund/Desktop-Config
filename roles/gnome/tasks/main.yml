---
- name: DNF packages for Gnome Settings
  ansible.builtin.dnf:
    name: python3-psutil
    state: present
  become: true
  tags:
    - home
    - work
    - sudo

- name: Gnome Settings
  community.general.dconf:
    key: "/org/gnome/desktop/interface/color-scheme"
    value: "'prefer-dark'"
    state: present
  tags:
    - home
    - work

- name: Gnome Clock
  community.general.dconf:
    key: "/org/gnome/desktop/interface/clock-format"
    value: "'24h'"
    state: present
  tags:
    - home
    - work

- name: Ensure autostart directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/autostart"
    state: directory
    mode: "0755"
  tags:
    - home
    - work

- name: Create autostart symlinks (common)
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/autostart/{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: "/usr/share/applications/org.mozilla.firefox.desktop"
      dest: "org.mozilla.firefox.desktop"
  tags:
    - home
    - work

- name: Create autostart symlinks (home)
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/autostart/{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: "/var/lib/flatpak/exports/share/applications/com.discordapp.Discord.desktop"
      dest: "com.discordapp.Discord.desktop"
    - src: "/var/lib/flatpak/exports/share/applications/org.signal.Signal.desktop"
      dest: "org.signal.Signal.desktop"
  tags:
    - home

- name: Install CLI tool to manage GNOME extensions
  ansible.builtin.pip:
    name: gnome-extensions-cli
    extra_args: --user --upgrade
  tags:
    - home
    - work

- name: Include Open Bar and VPN color tasks
  ansible.builtin.include_tasks: openbar.yml
  tags:
    - work
