---
- name: DNF packages for Gnome Settings
  ansible.builtin.dnf:
    name: python3-psutil
    state: present
  become: true
  tags:
    - home
    - work
    - sudo

- name: Gnome Settings
  community.general.dconf:
    key: "/org/gnome/desktop/interface/color-scheme"
    value: "'prefer-dark'"
    state: present
  tags:
    - home
    - work

- name: Gnome Clock
  community.general.dconf:
    key: "/org/gnome/desktop/interface/clock-format"
    value: "'24h'"
    state: present
  tags:
    - home
    - work

- name: Ensure autostart directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/autostart"
    state: directory
    mode: "0755"
  tags:
    - home
    - work

- name: Create autostart symlinks (common)
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/autostart/{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: "/usr/share/applications/org.mozilla.firefox.desktop"
      dest: "org.mozilla.firefox.desktop"
  tags:
    - home
    - work

- name: Create autostart symlinks (home)
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/autostart/{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: "/var/lib/flatpak/exports/share/applications/com.discordapp.Discord.desktop"
      dest: "com.discordapp.Discord.desktop"
    - src: "/var/lib/flatpak/exports/share/applications/org.signal.Signal.desktop"
      dest: "org.signal.Signal.desktop"
  tags:
    - home

- name: Install CLI tool to manage GNOME extensions
  ansible.builtin.pip:
    name: gnome-extensions-cli
    extra_args: --user --upgrade
  tags:
    - home
    - work

- name: Install Open Bar GNOME extension
  ansible.builtin.command:
    cmd: "{{ ansible_facts['env']['HOME'] }}/.local/bin/gext install openbar@neuromorph"
  register: gext_result
  changed_when: "'already installed' not in gext_result.stdout"
  tags:
    - work

- name: Load Open Bar dconf settings
  ansible.builtin.shell:
    cmd: "dconf load /org/gnome/shell/extensions/openbar/ < {{ role_path }}/files/openbar.dconf"
  tags:
    - work

- name: Deploy VPN color listener script
  ansible.builtin.copy:
    src: vpn-color-listener.sh
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/vpn-color-listener.sh"
    mode: "0755"
  tags:
    - work

- name: Ensure systemd user service directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user"
    state: directory
    mode: "0755"
  tags:
    - work

- name: Deploy VPN color listener systemd user service
  ansible.builtin.copy:
    src: vpn-color-listener.service
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/vpn-color-listener.service"
    mode: "0644"
  tags:
    - work

- name: Enable and start VPN color listener service
  ansible.builtin.systemd:
    name: vpn-color-listener.service
    enabled: true
    state: started
    scope: user
    daemon_reload: true
  tags:
    - work
