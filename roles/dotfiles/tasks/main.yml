---
- name: Stat gitconfig source
  ansible.builtin.stat:
    path: "{{ role_path }}/files/gitconfig"
  register: dotfiles_gitconfig_src
  tags:
    - home
    - work

- name: Stat gitconfig destination
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.gitconfig"
  register: dotfiles_gitconfig_dest
  tags:
    - home
    - work

- name: Backup existing gitconfig when not already linked
  ansible.builtin.copy:
    src: "{{ ansible_facts['env']['HOME'] }}/.gitconfig"
    dest: "{{ ansible_facts['env']['HOME'] }}/.gitconfig.bak"
    mode: '0644'
    remote_src: true
    force: false
  when:
    - dotfiles_gitconfig_dest.stat.exists
    - dotfiles_gitconfig_dest.stat.inode != dotfiles_gitconfig_src.stat.inode or
      dotfiles_gitconfig_dest.stat.dev != dotfiles_gitconfig_src.stat.dev
  tags:
    - home
    - work

- name: Install .gitconfig
  ansible.builtin.file:
    src: "{{ role_path }}/files/gitconfig"
    dest: "{{ ansible_facts['env']['HOME'] }}/.gitconfig"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: '0644'
    state: hard
    force: true
  tags:
    - home
    - work

- name: Stat bashrc source
  ansible.builtin.stat:
    path: "{{ role_path }}/files/bashrc"
  register: dotfiles_bashrc_src
  tags:
    - home
    - work

- name: Stat bashrc destination
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
  register: dotfiles_bashrc_dest
  tags:
    - home
    - work

- name: Backup existing bashrc when not already linked
  ansible.builtin.copy:
    src: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    dest: "{{ ansible_facts['env']['HOME'] }}/.bashrc.bak"
    mode: '0644'
    remote_src: true
    force: false
  when:
    - dotfiles_bashrc_dest.stat.exists
    - dotfiles_bashrc_dest.stat.inode != dotfiles_bashrc_src.stat.inode or
      dotfiles_bashrc_dest.stat.dev != dotfiles_bashrc_src.stat.dev
  tags:
    - home
    - work

- name: Install .bashrc
  ansible.builtin.file:
    src: "{{ role_path }}/files/bashrc"
    dest: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: '0644'
    state: hard
    force: true
  tags:
    - home
    - work

- name: Ensure git prompt script is present
  ansible.builtin.get_url:
    url: https://raw.github.com/git/git/master/contrib/completion/git-prompt.sh
    dest: "{{ ansible_facts['env']['HOME'] }}/.bash_git"
    mode: '0644'
    force: false
  tags:
    - home
    - work

- name: Ensure ~/.claude directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude"
    state: directory
    mode: '0755'
  tags:
    - home
    - work

- name: Create Claude global CLAUDE.md pointing to Rota AGENTS.md
  ansible.builtin.copy:
    content: "@{{ ansible_facts['env']['HOME'] }}/Documents/PKMS/00 - Rota/AGENTS.md\n"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/CLAUDE.md"
    mode: '0644'
    force: false
  tags:
    - home
    - work
