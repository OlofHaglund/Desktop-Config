---
# ticktick.yml
# Clones the ticktick_claude repository to /opt/ticktick_claude.
# The project uses TickTick's MCP server — no CLI install or credentials needed.
# On first use, run /mcp in Claude Code to complete OAuth authorization.

- name: TickTick Claude CLI directory
  ansible.builtin.file:
    path: /opt/ticktick_claude
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_id'] }}"
    mode: '0755'
    recurse: true
  become: true
  tags:
    - home
    - sudo

- name: TickTick Claude CLI source
  ansible.builtin.git:
    repo: https://github.com/jessejcollins/ticktick_claude.git
    dest: /opt/ticktick_claude
    version: main
    update: true
    force: true
  become: true
  tags:
    - home
    - sudo
